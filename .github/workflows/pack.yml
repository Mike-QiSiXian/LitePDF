name: pack

# 推送到 main 后自动打包。README 下载链接在提交前已按版本号写好。
# 三个安装包都上传成功后，这些链接即可下载。
# 失败时自动再试一次；仍然失败则在 README 中临时标注。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  pack:
    # Release 创建标签、以及失败标注提交，都不要再打一遍包。
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip pack]')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run pack:win
            artifact: windows
            path: release/*.exe
          - name: macOS arm64 and x64
            os: macos-latest
            command: npm run pack:mac
            artifact: macos
            path: release/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Write license
        shell: bash
        env:
          FOXIT_LICENSE_SN: ${{ secrets.FOXIT_LICENSE_SN }}
          FOXIT_LICENSE_KEY: ${{ secrets.FOXIT_LICENSE_KEY }}
        run: node scripts/write-license-from-env.mjs

      - name: Pack
        shell: bash
        env:
          # 未配置证书时不要尝试签名，避免 CI 在查找证书时失败
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -uo pipefail
          attempt=1
          until ${{ matrix.command }}; do
            if [ "$attempt" -ge 2 ]; then
              echo "打包已重试一次，仍然失败"
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "打包失败，开始第 ${attempt} 次尝试"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          exe="$(ls artifacts/LitePDF-Setup-*.exe)"
          version="$(basename "${exe}" .exe)"
          version="${version#LitePDF-Setup-}"
          tag="v${version}"
          test -f "artifacts/LitePDF-${version}-arm64.dmg"
          test -f "artifacts/LitePDF-${version}-x64.dmg"

          prev="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${tag}$" | head -n 1 || true)"
          changelog=""
          if [ -n "${prev}" ]; then
            changelog="$(git log "${prev}..HEAD" --pretty=format:'- %s' --no-merges || true)"
          fi
          if [ -z "${changelog}" ]; then
            changelog="- 发布 ${tag}"
          fi
          printf '%s\n' "${changelog}" > release-notes.md

          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "LitePDF ${tag}" --notes-file release-notes.md
          gh release upload "$tag" \
            "artifacts/LitePDF-Setup-${version}.exe" \
            "artifacts/LitePDF-${version}-arm64.dmg" \
            "artifacts/LitePDF-${version}-x64.dmg" \
            --clobber

          # 只在上次失败留下标注时才改 README，成功本身不再改下载链接。
          node scripts/update-readme-release.mjs "${version}"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 下载链接已指向 v${version}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: 移除 v${version} 的打包失败标注 [skip pack]"
          git pull --rebase origin main
          git push origin HEAD:main

  mark-failed:
    needs: pack
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Mark README until installers are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/update-readme-release.mjs --failed
          git add README.md
          if git diff --cached --quiet; then
            echo "README 已有失败标注"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(node -p "require('./package.json').version")"
          git commit -m "docs: 标注 v${version} 安装包打包失败 [skip pack]"
          git pull --rebase origin main
          git push origin HEAD:main
