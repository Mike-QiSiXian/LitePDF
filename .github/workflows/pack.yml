name: pack

# 发版时手动运行，或推送 v* 标签时打包三个平台的安装包。
# 三个安装包都成功后挂到 Release，并把 README 的下载链接提交回 main。
# 不在每次 push 时打包：安装包体积大，且必须注入未入库的 Foxit License。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    # 本工作流创建 Release 时会推送同名标签；跳过这次自动触发，避免再打一遍包。
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run pack:win
            artifact: windows
            path: release/*.exe
          - name: macOS arm64 and x64
            os: macos-latest
            command: npm run pack:mac
            artifact: macos
            path: release/*.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Write license
        shell: bash
        env:
          FOXIT_LICENSE_SN: ${{ secrets.FOXIT_LICENSE_SN }}
          FOXIT_LICENSE_KEY: ${{ secrets.FOXIT_LICENSE_KEY }}
        run: node scripts/write-license-from-env.mjs

      - name: Pack
        env:
          # 未配置证书时不要尝试签名，避免 CI 在查找证书时失败
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: ${{ matrix.command }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14

  release:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          exe="$(ls artifacts/LitePDF-Setup-*.exe)"
          version="$(basename "${exe}" .exe)"
          version="${version#LitePDF-Setup-}"
          tag="v${version}"
          test -f "artifacts/LitePDF-${version}-arm64.dmg"
          test -f "artifacts/LitePDF-${version}-x64.dmg"

          prev="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${tag}$" | head -n 1 || true)"
          changelog=""
          if [ -n "${prev}" ]; then
            changelog="$(git log "${prev}..HEAD" --pretty=format:'- %s' --no-merges || true)"
          fi
          if [ -z "${changelog}" ]; then
            changelog="- 发布 ${tag}"
          fi
          printf '%s\n' "${changelog}" > release-notes.md

          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "LitePDF ${tag}" --notes-file release-notes.md
          gh release upload "$tag" \
            "artifacts/LitePDF-Setup-${version}.exe" \
            "artifacts/LitePDF-${version}-arm64.dmg" \
            "artifacts/LitePDF-${version}-x64.dmg" \
            --clobber

          export LITEPDF_CHANGELOG="${changelog}"
          node scripts/update-readme-release.mjs "${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README 已是 v${version}，无需提交"
            exit 0
          fi
          git commit -m "docs: 更新 README 下载链接至 v${version}"
          git pull --rebase origin main
          git push origin main
