appId: com.litepdf.app
productName: LitePDF
copyright: Copyright © LitePDF
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist/foxit-lib/**'
  - '!dist/foxit-external/**'
# Chromium 语言包只留中英文，避免 locales 再占约 40MB
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
# SDK 核心库通过 extraResources 带一份；有本地 external 时一并打包（否则运行时用官方 webfonts）
extraResources:
  - from: public/foxit-lib
    to: foxit-lib
    filter:
      - '**/*'
      - '!**/*.d.ts'
      - '!stamps/de-DE/**'
      - '!stamps/es-419/**'
      - '!stamps/fr-FR/**'
      - '!stamps/it-IT/**'
      - '!stamps/ja-JP/**'
      - '!stamps/ko-KR/**'
      - '!stamps/nl-NL/**'
      - '!**/locales/de-DE/**'
      - '!**/locales/es-419/**'
      - '!**/locales/fr-FR/**'
      - '!**/locales/it-IT/**'
      - '!**/locales/ja-JP/**'
      - '!**/locales/ko-KR/**'
      - '!**/locales/nl-NL/**'
  - from: public/foxit-external
    to: foxit-external
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LitePDF-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LitePDF
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: LitePDF-${version}-${arch}.${ext}
dmg:
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
