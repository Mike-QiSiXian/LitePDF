appId: com.litepdf.app
productName: LitePDF
copyright: Copyright © LitePDF
directories:
  output: release
  buildResources: resources
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist/foxit-lib/**'
  - '!dist/foxit-external/**'
  # 运行时只走 extraResources 的 foxit-lib，避免 npm 整包再打进 asar
  - '!node_modules/@foxitsoftware/**'
# Chromium 语言包只留中英文，避免 locales 再占约 40MB
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
# SDK 核心库只通过 extraResources 带一份；字体走官方 webfonts + 本机 Local Font Access
extraResources:
  - from: public/foxit-lib
    to: foxit-lib
    filter:
      - '**/*'
      - '!**/*.d.ts'
      - '!stamps/de-DE/**'
      - '!stamps/es-419/**'
      - '!stamps/fr-FR/**'
      - '!stamps/it-IT/**'
      - '!stamps/ja-JP/**'
      - '!stamps/ko-KR/**'
      - '!stamps/nl-NL/**'
      - '!**/locales/de-DE/**'
      - '!**/locales/es-419/**'
      - '!**/locales/fr-FR/**'
      - '!**/locales/it-IT/**'
      - '!**/locales/ja-JP/**'
      - '!**/locales/ko-KR/**'
      - '!**/locales/nl-NL/**'
  - from: resources/icon.png
    to: icon.png
asar: true
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF 文档
    mimeType: application/pdf
    role: Viewer
    rank: Owner
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: LitePDF-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LitePDF
  include: build/installer.nsh
mac:
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  artifactName: LitePDF-${version}-${arch}.${ext}
dmg:
  contents:
    - x: 140
      y: 200
    - x: 400
      y: 200
      type: link
      path: /Applications
